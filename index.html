<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Self-hosted (жодних сторонніх доменів) — найважливіші підмножини
       Inter для першого рендеру: latin (усі 4 мови) і cyrillic (uk/ru). -->
  <link rel="preload" as="font" href="/fonts/inter-latin-wght-normal.woff2" type="font/woff2" crossorigin>
  <link rel="preload" as="font" href="/fonts/inter-cyrillic-wght-normal.woff2" type="font/woff2" crossorigin>


  <!-- Google Analytics: скрипт gtag.js НЕ вантажиться до згоди користувача
       (див. src/utils/consent.js). Тут лише "заглушка" з consent = denied. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
  </script>
  <style>
    html,
    body {
      background-color: #ffffff;

    }
  </style>

</head>

<body>

  <div id="root"></div>
  <script>
    // Тимчасові посилання /s/<id> (round 34) віддаються через rewrite на
    // пре-рендерену головну — ховаємо її вміст, поки React не відмалює
    // сторінку посилання (інакше на мить видно головну).
    if (/^\/(?:(?:en|ru|es)\/)?s\//.test(location.pathname)) {
      document.getElementById("root").innerHTML = "";
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
