<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <!-- «Фотостек»: три квадрати, що зменшуються — натяк на кілька файлів/розмірів одразу.
       Плоскі кольори (без градієнта) — свідомо мінімалістичніше за попередню версію. -->
  <rect x="20" y="29" width="150" height="150" rx="34" fill="#2E3FE0"/>
  <rect x="58" y="62" width="127" height="127" rx="29" fill="#3E6BFF"/>
  <rect x="92" y="87" width="104" height="104" rx="26" fill="#14C4BE"/>

  <!-- Текст: та сама дисципліна, що й у попередній версії — textLength зафіксовано,
       щоб напис завжди вміщувався повністю й не обрізався. Arial/Helvetica навмисно:
       файл підключається як <img src="…svg">, тому веб-шрифти (Google Fonts) у ньому
       не завантажаться — рендериться лише системний шрифт. -->
  <text x="300" y="130" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800"
        textLength="560" lengthAdjust="spacingAndGlyphs" fill="#12172B">Compress<tspan fill="#14C4BE">Photo</tspan></text>
</svg>
