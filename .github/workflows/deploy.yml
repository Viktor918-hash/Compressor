name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Тягне налаштування проєкту (org/project id) з Vercel — прив'язка
      # відбувається через секрети нижче, не через локальний .vercel/ файл
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Тут виконується "vite build" (з рядка package.json), а отже і
      # @prerenderer/rollup-plugin з Puppeteer — на цьому раннері Chrome
      # запускається без проблем із бібліотеками, на відміну від Vercel.
      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
